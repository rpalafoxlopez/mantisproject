<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="description" content="MANTIS - Plataforma de juegos de pensamiento crítico en tiempo real. Evalúa y potencia el razonamiento lógico con sesiones interactivas." />
    <meta name="keywords" content="quiz, pensamiento crítico, kahoot, evaluación, juego, tiempo real" />
    <meta property="og:title" content="MANTIS - Pensamiento Crítico en Tiempo Real" />
    <meta property="og:description" content="Evalúa y potencia el pensamiento crítico con sesiones interactivas estilo Kahoot." />
    <meta property="og:image" content="/img/logo.png" />
    <title>MANTIS - Pensamiento Crítico en Tiempo Real</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f1a;
        color: #e0e0e0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #app-loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.5s ease;
      }
      #app-loading.hidden { opacity: 0; pointer-events: none; }
      .loading-logo { width: 80px; height: 80px; margin-bottom: 1.5rem; animation: pulse 2s ease-in-out infinite; }
      .loading-text { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #00d4aa, #00a8e8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; }
      .loading-bar { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
      .loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00d4aa, #00a8e8); border-radius: 2px; animation: loading 1.5s ease-in-out forwards; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
      @keyframes loading { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <img src="/img/logo.png" alt="MANTIS" class="loading-logo" />
      <div class="loading-text">MANTIS</div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
